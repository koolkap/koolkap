name: Automatically Update GitHub Profile

on:
  schedule:
    - cron: "17 * * * *" # Run hourly

  workflow_dispatch: # Allow manual updates

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update profile activity
        run: python scripts/update_profile.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub profile activity"
            git push
          else
            echo "No changes to commit."
          fi